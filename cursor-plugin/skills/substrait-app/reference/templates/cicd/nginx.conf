# Serve the SPA: static files with a fallback to index.html for client-side routes.
# /api is routed to the backend by the Ingress, so it never reaches nginx.
#
# Do NOT add a `location /api/ { proxy_pass http://backend:8000; }` block here for local
# docker-compose. nginx resolves upstream hostnames when it loads this file, so a name
# that does not exist in the app's namespace ("backend", "api", a compose service) makes
# nginx refuse to start at all — the frontend crash-loops with `host not found in
# upstream` and the deploy fails. For compose, run `npm run dev` (Vite proxies /api), or
# keep a separate compose-only nginx config that this Dockerfile never copies.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
